name: publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "是否创建 Release"
        required: true
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# 私有仓库需要显式授权，否则无法创建 Release
permissions:
  contents: write

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取 tag 名称
        id: tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Tag: $TAG_NAME"

      - name: 解析版本号
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: 校验版本一致性
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          echo "📋 版本检查："
          echo "  Tag version: $TAG_VERSION"
          echo "  package.json: $PACKAGE_VERSION"
          echo "  Cargo.toml: $CARGO_VERSION"
          echo "  tauri.conf.json: $TAURI_VERSION"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || \
             [ "$TAG_VERSION" != "$CARGO_VERSION" ] || \
             [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
            echo "❌ 版本不一致！"
            exit 1
          fi

          echo "✅ 所有版本一致: $TAG_VERSION"

      - name: 生成 changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          FILTERED_COMMITS=$(echo "$COMMITS" | grep -v -E "^- (fix|feat|chore|refactor):.*(CI|workflow|release|changelog|draft|GitHub Actions|Base64|heredoc)" || echo "$COMMITS")

          CHANGELOG="## 🎉 教室小助手 ${{ github.ref_name }}

          ### 📝 更新内容
          $FILTERED_COMMITS

          ### 📦 安装说明
          请根据您的操作系统下载对应的安装包：
          - **Windows**: \`.exe\` 安装程序（NSIS）
          - **macOS (Apple Silicon)**: \`.dmg\` 适用于 M1/M2/M3/M4 芯片的 Mac
          - **macOS (Intel)**: \`.dmg\` 适用于 Intel 芯片的 Mac

          ### 🔗 相关链接
          - [项目仓库](https://github.com/${{ github.repository }})"

          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG="$CHANGELOG
          - [完整变更](https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${{ github.ref_name }})"
          fi

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT
        shell: bash

  publish-tauri:
    needs: [generate-changelog]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true
          key: ${{ matrix.platform }}-${{ matrix.args }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          shared-key: rust-cache

      - name: 设置 Release 信息
        id: release-info
        run: |
          echo "tag_name=${{ needs.generate-changelog.outputs.tag_name }}" >> $GITHUB_OUTPUT
          echo "release_name=教室小助手 ${{ needs.generate-changelog.outputs.tag_name }}" >> $GITHUB_OUTPUT

          {
            echo "release_body<<EOF"
            echo "${{ needs.generate-changelog.outputs.changelog }}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "is_draft=true" >> $GITHUB_OUTPUT
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        shell: bash

      - uses: tauri-apps/tauri-action@action-v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release-info.outputs.tag_name }}
          releaseName: ${{ steps.release-info.outputs.release_name }}
          releaseBody: ${{ steps.release-info.outputs.release_body }}
          releaseDraft: ${{ steps.release-info.outputs.is_draft }}
          prerelease: ${{ steps.release-info.outputs.is_prerelease }}
          args: ${{ matrix.args }}

      - name: 验证构建产物
        if: always()
        run: |
          echo "🔍 验证构建产物..."

          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            if ls src-tauri/target/release/bundle/nsis/*.exe 1> /dev/null 2>&1; then
              echo "✅ Windows 安装程序已生成"
              ls -lh src-tauri/target/release/bundle/nsis/*.exe
            else
              echo "❌ Windows 安装程序未找到！"
              exit 1
            fi
          elif [ "${{ matrix.platform }}" == "macos-latest" ]; then
            if [ "${{ matrix.args }}" == "--target aarch64-apple-darwin" ]; then
              TARGET_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
            else
              TARGET_DIR="src-tauri/target/x86_64-apple-darwin/release/bundle/dmg"
            fi

            if ls $TARGET_DIR/*.dmg 1> /dev/null 2>&1; then
              echo "✅ macOS DMG 已生成"
              ls -lh $TARGET_DIR/*.dmg
            else
              echo "❌ macOS DMG 未找到！"
              echo "查找路径: $TARGET_DIR"
              exit 1
            fi
          fi
        shell: bash

  notify-completion:
    needs: [publish-tauri]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 构建摘要
        run: |
          echo "## 🎉 教室小助手构建完成！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Release 信息" >> $GITHUB_STEP_SUMMARY
          echo "- **版本**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **状态**: Draft（需要手动发布）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ 构建平台" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Windows (x64)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ macOS (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ macOS (Intel)" >> $GITHUB_STEP_SUMMARY
