name: Lint

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "*.config.*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "src/**"
      - "*.config.*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/lint.yml"

concurrency:
  group: lint-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: ESLint 检查
        run: npm run lint

      - name: 代码格式检查
        run: npm run format:check
